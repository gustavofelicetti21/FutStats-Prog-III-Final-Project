services:
  postgres:
    image: postgres:16
    container_name: futstats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: futstats
      POSTGRES_USER: futstats
      POSTGRES_PASSWORD: futstats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
